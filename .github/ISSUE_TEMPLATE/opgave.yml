name: Propose a documentation task
description: Suggest a specific task to improve this public repository.
title: "[Task]: "
body:
  - type: markdown
    attributes:
      value: |
        This repository hosts the public organization profile and shared guidance. Do not use this form for internal product work or support.
  - type: textarea
    id: task
    attributes:
      label: What should be done?
      description: State the expected result clearly.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is this useful?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: How will we know it is complete?
      value: |
        - [ ]
        - [ ]
    validations:
      required: false
