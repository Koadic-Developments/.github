name: Report a problem with this repository
description: Report a problem with the public organization profile or shared documentation.
title: "[Problem]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for issues in this public repository only. For product support, visit [koadic.dk](https://koadic.dk). Never include personal data, credentials, or confidential information.
  - type: textarea
    id: summary
    attributes:
      label: What is wrong?
      description: Describe the problem and where you found it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      placeholder: "1. Open ...\n2. Follow ...\n3. Observe ..."
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links or screenshots that do not contain private information.
    validations:
      required: false
