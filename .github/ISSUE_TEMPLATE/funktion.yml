name: Suggest an improvement
description: Suggest an improvement to the public organization profile or shared documentation.
title: "[Suggestion]: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for this repository only. Product requests and support should go through [koadic.dk](https://koadic.dk). Do not include confidential or personal information.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the current difficulty and who it affects.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you change?
      description: Describe the improvement you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or examples
    validations:
      required: false
