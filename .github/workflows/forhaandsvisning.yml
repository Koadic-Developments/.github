# ══ FORHAANDSVISNING PR. PULL REQUEST ══
#
# Hver aaben PR faar sin egen adresse: pr-<n>-<system>.koadic.dk.
#
# SAMME VEJ SOM PRODUKTIONEN. rsync til en mappe, Caddy + PHP-FPM ovenpaa —
# noejagtig som de rigtige udrulninger. En forhaandsvisning, der koerer ad en
# anden vej (en container, en anden PHP, en anden webserver), viser ikke det,
# der bliver sendt. Saa er den ikke en forhaandsvisning; saa er den et gaet.
#
# Saadan kaldes den:
#
#     jobs:
#       forhaandsvisning:
#         uses: Koadic-Developments/.github/.github/workflows/forhaandsvisning.yml@main
#         with:
#           system: design

name: Forhaandsvisning

on:
  workflow_call:
    inputs:
      system:
        description: 'Systemets korte navn. Bliver til pr-<n>-<system>.koadic.dk'
        type: string
        required: true
      offentlig-mappe:
        description: 'Hvor index.php ligger, set fra repoets rod.'
        type: string
        default: 'public'

jobs:
  udrul:
    # Kun paa VPS'en. Den har mappen, Caddy og PHP-FPM.
    runs-on: [self-hosted, koadic-vps]
    permissions:
      contents: read
      pull-requests: write
    if: github.event.action != 'closed'
    steps:
      - uses: actions/checkout@v4

      - name: Laeg den paa plads
        env:
          SYSTEM: ${{ inputs.system }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MAPPE="/opt/previews/${SYSTEM}-${PR}"

          # --delete, saa en fjernet fil ogsaa forsvinder fra forhaandsvisningen.
          # Uden den ville en PR, der SLETTER noget, se ud som om den ikke gjorde.
          mkdir -p "$MAPPE"
          rsync -a --delete \
            --exclude '.git' --exclude '.github' \
            --exclude '.env' --exclude '.env.forhaandsvisning' \
            ./ "$MAPPE/"

          # INGEN OPSAETNING SKRIVES HER. Den ligger i /etc/koadic-<system>-fv.env,
          # ejet af root og laest af www-data.
          #
          # Foerste udgave kopierede en skabelon ind i mappen — men den skulle
          # indeholde AUTH_NOEGLE, den RIGTIGE noegle til auth, og laa et sted
          # ghrunner kunne laese. En env, en workflow kan laese, er en
          # hemmelighed, en workflow kan laekke.
          #
          # Koden vaelger selv den rigtige fil, naar den koerer under
          # /opt/previews — se includes/env.php.

          # PHP-FPM koerer som www-data og skal kunne laese det hele.
          chmod -R a+rX "$MAPPE"
          chgrp -R www-data "$MAPPE" 2>/dev/null || true

          echo "  udrullet til $MAPPE ($(find "$MAPPE" -type f | wc -l | tr -d ' ') filer)"

      - name: Er den der, og svarer den?
        env:
          SYSTEM: ${{ inputs.system }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          ADR="https://pr-${PR}-${SYSTEM}.koadic.dk/"

          # ET GROENT TRIN ER IKKE «UDE». Vi henter siden og ser paa svaret.
          for i in 1 2 3 4 5; do
            K=$(curl -s -o /tmp/fv.html -w '%{http_code}' -m 20 "$ADR" || echo 000)
            case "$K" in
              200|302) echo "  $ADR svarer $K"; exit 0 ;;
            esac
            echo "  forsoeg $i: $K — venter"
            sleep 4
          done

          echo "::error::forhaandsvisningen svarer ikke ($K)"
          head -c 400 /tmp/fv.html || true
          exit 1

      - name: Skriv adressen paa PR'en
        env:
          GH_TOKEN: ${{ github.token }}
          SYSTEM: ${{ inputs.system }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          ADR="https://pr-${PR}-${SYSTEM}.koadic.dk/"

          # ADRESSEN I OPSUMMERINGEN FOERST. Den staar der, ogsaa hvis
          # kommentaren fejler — og en forhaandsvisning, man ikke kan finde
          # adressen paa, er ikke til megen nytte.
          {
            echo "### Forhaandsvisning"
            echo ""
            echo "**$ADR**"
          } >> "$GITHUB_STEP_SUMMARY"

          # CURL OG IKKE gh. Den selvhostede runner er produktionsserveren, og
          # der skal ikke installeres et vaerktoej mere for en kommentars skyld.
          MAERKE="<!-- koadic-forhaandsvisning -->"
          API="https://api.github.com/repos/$REPO"

          python3 - "$ADR" "$MAERKE" > /tmp/fv-krop.json <<'PYKODE'
          import json, subprocess, sys
          adr, maerke = sys.argv[1], sys.argv[2]
          sha = subprocess.run(['git','rev-parse','--short','HEAD'],
                               capture_output=True, text=True).stdout.strip()
          krop = (
              maerke + "\n\n"
              "### Forhaandsvisning\n\n"
              "**" + adr + "**\n\n"
              "Samme vej som produktionen — rsync, Caddy, PHP-FPM. Egen database, "
              "som ikke kan naa den rigtige.\n\n"
              "Den forsvinder, naar PR-en lukkes.\n\n"
              "<sub>commit `" + sha + "`</sub>\n"
          )
          json.dump({"body": krop}, sys.stdout)
          PYKODE

          # ÉN kommentar, der opdateres — ikke en ny for hvert push.
          ID=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "$API/issues/$PR/comments?per_page=100" \
               | python3 -c "
          import json,sys
          try: d=json.load(sys.stdin)
          except Exception: sys.exit()
          for k in d:
              if '$MAERKE' in (k.get('body') or ''):
                  print(k['id']); break
          ")

          if [ -n "${ID:-}" ]; then
            KODE=$(curl -sS -o /dev/null -w '%{http_code}' -X PATCH \
                     -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     -d @/tmp/fv-krop.json "$API/issues/comments/$ID")
            echo "  kommentaren opdateret ($KODE)"
          else
            KODE=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
                     -H "Authorization: Bearer $GH_TOKEN" \
                     -H "Accept: application/vnd.github+json" \
                     -d @/tmp/fv-krop.json "$API/issues/$PR/comments")
            echo "  kommentaren skrevet ($KODE)"
          fi

          # En kommentar, der ikke kan skrives, maa ikke faelde en
          # forhaandsvisning, der VIRKER. Adressen staar i opsummeringen.
          case "$KODE" in
            200|201) ;;
            *) echo "::warning::kunne ikke skrive kommentaren ($KODE) — adressen staar i opsummeringen" ;;
          esac

  ryd-op:
    runs-on: [self-hosted, koadic-vps]
    if: github.event.action == 'closed'
    steps:
      - name: Fjern forhaandsvisningen
        env:
          SYSTEM: ${{ inputs.system }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          MAPPE="/opt/previews/${SYSTEM}-${PR}"

          # EN LUKKET PR SKAL RYDDE OP EFTER SIG. Ellers har VPS'en tredive
          # halvdoede kopier om et halvt aar — og en af dem koerer maaske
          # stadig kode, ingen har set paa siden marts.
          case "$MAPPE" in
            /opt/previews/*-*) ;;
            *) echo "::error::mistaenkelig sti: $MAPPE"; exit 1 ;;
          esac

          if [ -d "$MAPPE" ]; then
            rm -rf "$MAPPE"
            echo "  fjernet: $MAPPE"
          else
            echo "  fandtes ikke i forvejen: $MAPPE"
          fi
