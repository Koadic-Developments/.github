name: Test

# Kører på hver pull request mod main — INTET må merges uden at bestå.
# Det er kontrollen, der forhindrer at ødelagt kode når produktion.
# Use a GitHub-hosted runner so fork pull requests never execute on the Koadic VPS.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Kodekontrol
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: PHP-syntakstjek af ændrede filer
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 --quiet || true
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.php' || true)
          if [ -z "$files" ]; then
            echo "Ingen PHP-filer ændret."
            exit 0
          fi
          command -v php >/dev/null || { echo "php mangler på runneren — springer over."; exit 0; }
          fejl=0
          for f in $files; do
            [ -f "$f" ] || continue
            if out=$(php -l "$f" 2>&1); then
              echo "  ok   $f"
            else
              echo "  FEJL $f"
              echo "$out"
              fejl=1
            fi
          done
          exit $fejl

      - name: Ingen fremmed AI-branding
        run: |
          # Koadics systemer må ikke nævne eller ligne andre firmaers AI.
          base="origin/${{ github.base_ref }}"
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD || true)
          [ -z "$files" ] && exit 0
          fundet=0
          for f in $files; do
            [ -f "$f" ] || continue
            # Denne fil indeholder selv søgemønstrene — spring den over.
            [ "$f" = ".github/workflows/ci.yml" ] && continue
            if grep -inE 'claude|anthropic|co-authored-by: *claude|generated with' "$f"; then
              echo "  → fundet i $f"
              fundet=1
            fi
          done
          if [ "$fundet" = "1" ]; then
            echo ""
            echo "Fjern henvisningerne før denne PR kan merges."
            exit 1
          fi
          echo "Rent — ingen fremmed AI-branding."

      - name: Commit-beskeder er rene
        run: |
          base="origin/${{ github.base_ref }}"
          if git log --format='%s%n%b' "$base"..HEAD | grep -inE 'claude|anthropic|co-authored-by: *claude'; then
            echo ""
            echo "En commit-besked nævner et fremmed AI-værktøj. Omskriv beskeden."
            exit 1
          fi
          echo "Commit-beskeder er rene."
