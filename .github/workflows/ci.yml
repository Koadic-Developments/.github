name: Test

# Run relevant checks for changes to this repository.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Kodekontrol
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Hent kode
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none

      - name: PHP-syntakstjek af ændrede filer
        run: |
          base="origin/${{ github.base_ref }}"
          git fetch origin "${{ github.base_ref }}" --depth=1 --quiet || true
          files=$(git diff --name-only --diff-filter=ACMR "$base"...HEAD -- '*.php' || true)
          if [ -z "$files" ]; then
            echo "Ingen PHP-filer ændret."
            exit 0
          fi
          command -v php >/dev/null || { echo "php mangler på runneren — springer over."; exit 0; }
          fejl=0
          for f in $files; do
            [ -f "$f" ] || continue
            if out=$(php -l "$f" 2>&1); then
              echo "  ok   $f"
            else
              echo "  FEJL $f"
              echo "$out"
              fejl=1
            fi
          done
          exit $fejl
